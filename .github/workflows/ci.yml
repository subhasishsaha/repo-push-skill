name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify skill structure and templates
        run: |
          python -c "import json, pathlib; json.loads(pathlib.Path('plugin.json').read_text())"
          python -c "import json, pathlib; json.loads(pathlib.Path('schemas/repo-push.schema.json').read_text())"
          python -c "import json, pathlib; json.loads(pathlib.Path('schemas/repo-push-actions.schema.json').read_text())"
          test -f skills/repo-push/SKILL.md || exit 1
          test -f README.md || exit 1

      - name: Test configuration validation script
        run: |
          python skills/repo-push/scripts/validate_config.py

      - name: Test deterministic configuration generator
        run: |
          python skills/repo-push/scripts/generate_config.py --dry-run

      - name: Test behavioral isolation enforcement script
        run: |
          python skills/repo-push/scripts/enforce_isolation.py snapshot
          python skills/repo-push/scripts/enforce_isolation.py lock
          python skills/repo-push/scripts/enforce_isolation.py verify
          python skills/repo-push/scripts/enforce_isolation.py unlock

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run canonical repository readiness audit
        run: |
          python skills/repo-push/scripts/audit_runner.py

  test-windows:
    name: Test Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify skill structure and templates
        run: |
          python -c "import json, pathlib; json.loads(pathlib.Path('plugin.json').read_text())"
          python -c "import json, pathlib; json.loads(pathlib.Path('schemas/repo-push.schema.json').read_text())"
          python -c "import json, pathlib; json.loads(pathlib.Path('schemas/repo-push-actions.schema.json').read_text())"
          python -c "import pathlib; assert pathlib.Path('skills/repo-push/SKILL.md').is_file()"
          python -c "import pathlib; assert pathlib.Path('README.md').is_file()"

      - name: Test configuration validation script
        run: |
          python skills/repo-push/scripts/validate_config.py

      - name: Test deterministic configuration generator
        run: |
          python skills/repo-push/scripts/generate_config.py --dry-run

      - name: Test behavioral isolation enforcement script
        run: |
          python skills/repo-push/scripts/enforce_isolation.py snapshot
          python skills/repo-push/scripts/enforce_isolation.py lock
          python skills/repo-push/scripts/enforce_isolation.py verify
          python skills/repo-push/scripts/enforce_isolation.py unlock

      - name: Run automated test suite (including Win32 Security API & DACL tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run canonical repository readiness audit
        run: |
          python skills/repo-push/scripts/audit_runner.py
